[project]
name = "switchboard-llm-gateway"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway with routing, fallback, caching, and cost/latency tracking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient warns about its httpx dependency; not our code.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
